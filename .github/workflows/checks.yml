name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Decision catalogue and lookup
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: Capture utility and publication checks
        run: node --test tests/capture.test.mjs tests/samples.test.mjs tests/future.test.mjs tests/site.test.mjs
